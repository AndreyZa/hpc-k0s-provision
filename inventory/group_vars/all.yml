---
# Версия k0s (совпадает со STAGE; >=1.35 нужно для config D / slurm-bridge).
k0s_version: "v1.35.6+k0s.0"

# SSH-ключ, которым k0sctl и ansible ходят на узлы.
ssh_key_path: "~/.ssh/id_ed25519"

# Ядро/perf. paranoid=1 — рекомендация стенда (cgroup-scoped perf + CAP_PERFMON
# у агента); ужесточение до 3 потребует CAP_SYS_ADMIN. См. docs «Ввод §5».
perf_event_paranoid: 1

# CPU governor на измерительных узлах — performance для стабильности makespan.
# Персистентно: systemd-юнит cpupower-governor.service (роль perf).
bench_cpu_governor: performance

# «Узел исполняет измеряемую нагрузку» — критерий, по которому применяются
# perf-настройки (governor, watchdog). Раньше они гейтились ровно по группе
# bench, и стенд с СОВМЕЩЁННЫМИ ролями (один узел = control-plane + ss-system +
# нагрузка, как домашняя лаба) молча оставался на schedutil: check.yml печатал
# «governor: n/a (не bench)» и не жаловался. Переопредели в host_vars, если
# узел вне группы bench всё-таки считает задачи.
node_runs_workload: "{{ inventory_hostname in groups['bench'] | default([]) }}"

# NMI-watchdog занимает один аппаратный PMU-счётчик на КАЖДОМ ядре. Агент
# снимает по 4 события на cgroup пода, и на узле с плотным заселением ядро
# начинает мультиплексировать счётчики (замерено на лабе: 83.3% времени на
# 6 событиях вместо 100%) — значения LLC/NUMA становятся экстраполяцией,
# а не подсчётом. Стенду watchdog не нужен: узлы под наблюдением.
perf_nmi_watchdog: 0

# Автобалансировка NUMA. Значение фиксируется ЯВНО, потому что от него прямо
# зависит NUMA-ось: с включённой автобалансировкой ядро мигрирует страницы
# между доменами прямо во время замера, и numa_remote_ratio меряет уже
# реакцию балансировщика, а не размещение задачи. Раньше не задавалось нигде —
# на прод-Xeon с двумя доменами это был бы дефолт дистрибутива (1), то есть
# результат зависел бы от того, что решил мейнтейнер Ubuntu.
# 0 = выключена (детерминизм замера). Пишется в провенанс серии.
# РЕШЕНИЕ ОТЛОЖЕНО (18.08.2026): начинаем с 0, а на проде проводим обе
# серии (0 и 1) и выбираем по данным — насколько автобалансировка вообще
# двигает numa_remote_ratio и makespan на двухсокетном Xeon. До этого
# сравнения не трактовать 0 как методическую догму.
kernel_numa_balancing: 0

# hostname узла = имя в инвентаре (cp1, sssystem, bench1…). Имя узла k8s
# берётся из hostname, testbed адресует ss-system по нему. false — не трогать.
manage_hostname: true

# Выключить фоновые apt-обновления: апгрейд посреди серии портит измерения.
# Обновлять вручную между сериями.
disable_unattended_upgrades: true

# Динамическое хранилище (playbooks/storage.yml). Нужен StorageClass ПО
# УМОЛЧАНИЮ: манифесты стенда просят тома без storageClassName (ClickHouse),
# и без дефолтного класса PVC зависает в Pending.
local_path_version: "v0.0.36"
# Каталог томов на узле — рядом с данными мониторинга
# (/var/lib/sensitivityscore/{prometheus,grafana}), чтобы всё состояние
# стенда лежало под одним путём.
local_path_dir: "/var/lib/sensitivityscore/local-path"
