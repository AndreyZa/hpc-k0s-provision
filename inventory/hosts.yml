---
# Инвентарь прод-стенда — адреса от партнёра, получены 18.08.2026.
# Группы: controllers (CP-ВМ) + workers (= ss_system + bench). k0sctl.yaml
# генерируется из этих групп (см. playbooks/templates/k0sctl.yaml.j2);
# в шаблон уходят только ansible_host, ключи хостов — ярлыки ansible.
#
# У bench-узлов два адреса: LAN (ansible_host — по нему провижн и kubelet) и
# iDRAC/BMC (idrac_host — плейбуками НЕ используется, лежит здесь как
# единственный источник для энерговетки: ipmi-exporter/замер мощности).
all:
  vars:
    ansible_user: root             # доступ от партнёра — root на всех хостах
  children:

    controllers:                   # 3 CP-ВМ, k0s control-plane, HA-кворум etcd
      hosts:
        control-plane-1: { ansible_host: "10.40.10.1" }
        control-plane-2: { ansible_host: "10.40.10.2" }
        control-plane-3: { ansible_host: "10.40.10.3" }

    ss_system:                     # 1 ss-system-ВМ: Redis, scheduler, metrics-server, ClickHouse
      hosts:
        ss-system: { ansible_host: "10.40.10.0" }

    bench:                         # 3× Dell R760 bare-metal (измерительные)
      hosts:
        wrk-b6: { ansible_host: "10.40.200.106", idrac_host: "10.21.200.106" }
        wrk-b7: { ansible_host: "10.40.200.107", idrac_host: "10.21.200.107" }
        wrk-b8: { ansible_host: "10.40.200.108", idrac_host: "10.21.200.108" }

    workers:                       # всё, что несёт kubelet (ss_system + bench)
      children:
        ss_system: {}
        bench: {}
