---
# Операторская машина (лаб-хост): с неё гоняются серии, на ней kubeconfig'и
# стенда, VPN до партнёрской сети и статус-страница прогона. В кластер
# стенда она НЕ входит и измерений не несёт.
#
# Запуск: make lab   (или ansible-playbook -i inventory/hosts.yml playbooks/lab.yml)
#
# Почему отдельным плейбуком, а не частью site.yml: site.yml разворачивает
# СТЕНД, и случайный прогон «всего сразу» не должен уметь поставить своп и
# earlyoom на измерительный узел. Роль это дополнительно проверяет сама.
- name: Операторская машина
  hosts: lab
  become: true
  roles:
    - labhost
