---
# Выравнивание ядра: ВМ подтягиваются к bench, а не наоборот (уточнение
# 19.08.2026). Bench-узлы — измерительная среда и эталон версии; трогать их
# без нужды нельзя, поэтому по умолчанию плейбук ходит ТОЛЬКО на ВМ
# (controllers + ss_system). Bench — только явным kernel_hosts=bench и
# только между сериями (apt на измерительном узле — IO и кэш-шум в тех
# самых счётчиках).
#
# Версия ЗАПИНЕНА (никакого state: latest — иначе ВМ уехали бы на более
# свежее ядро из архива, и разъезд повторился бы в другую сторону).
# Эталон = ядро bench; менять пин — осознанным коммитом при следующем
# апгрейде кампании (вместе с ребутом bench между сериями).
# Метапакеты ставятся на hold: без этого unattended-upgrades притащит
# следующее ядро сам и пин перестанет что-либо значить.
#
# Плейбук НЕ ребутит — докладывает, кому нужен ребут; сам ребут отдельным
# явным шагом: make kernel-reboot LIMIT=<узел> (на ss-system живут
# ClickHouse/планировщик/Redis — момент выбирает оператор).
- name: Выровнять ядро (по умолчанию — только ВМ)
  hosts: "{{ kernel_hosts | default('controllers:ss_system') }}"
  become: true
  vars:
    kernel_version: "6.8.0-138"   # эталон: ядро bench-узлов (снято 19.08.2026)
  tasks:
    - name: Установить пиновую версию ядра
      ansible.builtin.apt:
        name:
          - "linux-image-{{ kernel_version }}-generic"
          - "linux-modules-extra-{{ kernel_version }}-generic"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Заморозить метапакеты ядра (unattended-upgrades не двигает версию)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - linux-generic
        - linux-image-generic
        - linux-headers-generic

    - name: Сравнить работающее ядро с пином
      ansible.builtin.shell: |
        set -o pipefail
        running=$(uname -r)
        if [ "$running" = "{{ kernel_version }}-generic" ]; then verdict="совпадает"; else verdict="НУЖЕН РЕБУТ"; fi
        echo "running=$running pin={{ kernel_version }}-generic [$verdict]"
      args:
        executable: /bin/bash
      register: kernel_state
      changed_when: false

    - name: Итог по узлу
      ansible.builtin.debug:
        msg: "{{ kernel_state.stdout }}"
