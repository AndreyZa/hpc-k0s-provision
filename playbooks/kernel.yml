---
# Выравнивание ядра: ВМ подтягиваются к bench, а не наоборот (уточнение
# 19.08.2026). Bench-узлы — измерительная среда и эталон версии (они на
# новейшем ядре: 6.8.0-138 против 6.8.0-136 на ВМ); трогать их без нужды
# нельзя, поэтому по умолчанию плейбук ходит ТОЛЬКО на ВМ
# (controllers + ss_system). Bench — только явным kernel_hosts=bench и
# только между сериями (apt на измерительном узле — IO и кэш-шум в тех
# самых счётчиках).
#
# Точное выравнивание — пином: -e kernel_version=6.8.0-138 ставит ровно
# эту версию (иначе state: latest мог бы увезти ВМ на более свежее ядро
# из архива, и разъезд повторился бы в другую сторону).
#
# Плейбук НЕ ребутит — докладывает, кому нужен ребут; сам ребут отдельным
# явным шагом: make kernel-reboot LIMIT=<узел> (на ss-system живут
# ClickHouse/планировщик/Redis — момент выбирает оператор).
- name: Выровнять ядро (по умолчанию — только ВМ)
  hosts: "{{ kernel_hosts | default('controllers:ss_system') }}"
  become: true
  tasks:
    - name: Установить пиновую версию ядра
      ansible.builtin.apt:
        name:
          - "linux-image-{{ kernel_version }}-generic"
          - "linux-modules-extra-{{ kernel_version }}-generic"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: kernel_version is defined

    - name: Установить новейшее ядро серии (linux-generic)
      ansible.builtin.apt:
        name: linux-generic
        state: latest
        update_cache: true
        cache_valid_time: 3600
      when: kernel_version is not defined

    - name: Сравнить работающее ядро с новейшим установленным
      ansible.builtin.shell: |
        set -o pipefail
        latest=$(ls /boot/vmlinuz-* | sed 's|.*vmlinuz-||' | sort -V | tail -1)
        running=$(uname -r)
        if [ "$running" = "$latest" ]; then verdict="совпадает"; else verdict="НУЖЕН РЕБУТ"; fi
        echo "running=$running latest=$latest [$verdict]"
      args:
        executable: /bin/bash
      register: kernel_state
      changed_when: false

    - name: Итог по узлу
      ansible.builtin.debug:
        msg: "{{ kernel_state.stdout }}"
