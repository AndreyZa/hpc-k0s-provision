---
- name: OS-подготовка узлов стенда
  hosts: all
  become: true
  roles:
    - common   # пакеты, swap off, время, cgroup v2
    - perf     # perf_event_paranoid, PSI-проверка, governor на узлах с нагрузкой

# node_exporter — ТОЛЬКО на контроллерах, и это не произвол:
#   - контроллеры k0s работают без kubelet, подов на них не запустить, поэтому
#     DaemonSet мониторинга (bench-репо, k8s/monitoring) до них не достаёт;
#   - на ss-system тот же экспортёр уже работает подом с hostNetwork и занимает
#     порт 9100 — пакет на хосте с ним бы подрался;
#   - на измерительных узлах его нет намеренно (методика: никаких посторонних
#     процессов, читающих /proc и /sys, в LLC/IO замеров).
- name: Экспортёр метрик ВМ control-plane
  hosts: controllers
  become: true
  roles:
    - nodeexporter
