---
# Аварийный своп. Размер выбран от объёма ОЗУ хоста (6.2 ГиБ): буфера в 8 ГБ
# хватает, чтобы пережить одного крупного едока, а не чтобы работать в свопе.
labhost_swap_path: /swapfile
labhost_swap_size: 8G
labhost_swappiness: 10

# Строка запуска k0s на операторской машине. Однонодовый контроллер: лаба —
# полигон для тестов плагина и харнесса, а не кластер стенда.
labhost_k0s_bin: /usr/local/bin/k0s
labhost_k0s_args: --single=true

# earlyoom: порог в процентах свободной памяти и свободного свопа.
labhost_earlyoom_mem: 5
labhost_earlyoom_swap: 75
# Неприкосновенные: без ssh машину не спасти удалённо, без k0s/containerd
# нечего спасать, clickhouse держит точку правды по числам кампаний.
labhost_earlyoom_avoid: '^(k0s|kubelet|containerd|kine|sshd|systemd|clickhouse-serv)$'

labhost_journal_max: 500M

# VPN до стенда. Конфиг с приватным ключом в репозитории не хранится — роль
# только проверяет, что маршруты на месте. iDRAC нужны поллеру мощности,
# PDU — энергетической ветке (обе AP8853 подключены 20.08.2026).
labhost_wg_conf: /etc/wireguard/wg0.conf
labhost_wg_required_ips:
  - 10.21.200.106
  - 10.21.200.107
  - 10.21.200.108
  - 10.21.200.246
  - 10.21.200.247

# Службы, ненужные на операторской машине. ОБНОВЛЕНИЯ СЮДА НЕ ВНОСИТЬ:
# apt-daily, unattended-upgrades, snap refresh и canonical-livepatch
# оставлены включёнными осознанно (решение оператора 20.08.2026).
labhost_disable_units:
  - cups.service
  - cups.socket
  - cups.path
  - cups-browsed.service
  - avahi-daemon.service
  - avahi-daemon.socket
  - bluetooth.service
  - ModemManager.service
  - switcheroo-control.service
  - docker.service
  - docker.socket
  - AmneziaVPN.service
  # У whoopsie гасится ПУТЬ, а не сам сервис: сервис static (без секции
  # [Install]), «выключить» его нельзя — systemd поднимает его по
  # whoopsie.path. Попытка отключать static-юниты давала вечный changed на
  # каждом прогоне роли и маскировала настоящий дрейф (20.08.2026).
  #
  # colord.service в списке НЕТ и добавлять не нужно — решение оператора
  # 20.08: за машиной работают физически, а colord обслуживает цвет в
  # графической сессии и поднимается по требованию через D-Bus.
  - whoopsie.path
