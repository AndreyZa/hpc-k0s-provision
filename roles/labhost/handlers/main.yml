---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart k0scontroller
  ansible.builtin.systemd_service:
    name: k0scontroller
    state: restarted
    daemon_reload: true

- name: Restart earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom
    state: restarted
