---
- name: перечитать sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: перечитать systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: перезапустить k0scontroller
  ansible.builtin.systemd_service:
    name: k0scontroller
    state: restarted
    daemon_reload: true

- name: перезапустить earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom
    state: restarted
